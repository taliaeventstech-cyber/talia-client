name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run security:audit

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Start local Supabase
        run: npx supabase start

      - name: Test email tenant isolation
        run: npx supabase test db supabase/tests/email_tenant_isolation.sql

      - name: Test distributed security rate limits
        run: npx supabase test db supabase/tests/security_rate_limits.sql

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
